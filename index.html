<script>
  /* language before paint — Arabic for Arabic browsers, else English.
     A saved choice always wins. */
  (function () {
    var s = null;
    try { s = localStorage.getItem("mz-lang"); } catch (e) {}
    var l = s || ((navigator.language || "en").toLowerCase().indexOf("ar") === 0 ? "ar" : "en");
    document.documentElement.lang = l;
    document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
  })();
</script>
<style>
  :root{
    --teal:#008080;
    --teal-600:#00706f;
    --teal-tint:#e6f2f2;
    --teal-soft:#dbeeee;
    --accent:#f4a72c;          /* monogram rule + the dot on the i */
    --accent-deep:#d98c12;
    --ink:#2b2b2b;
    --ink-2:#575757;
    --ink-3:#7e7e7e;
    --ink-4:#a7a7a7;
    --page:#f7fafa;
    /* alternating section bands — each differs from its neighbours */
    --band:#ffffff;
    --card-bg:#ffffff;
    --chip-bg:#f2f7f7;
    --band-tint:#eef5f6;
    --card-on-tint:#ffffff;
    --card-on-plain:#f7fbfb;
    --white:#fff;
    --line:#e4ecec;
    --line-2:#eef4f4;
    --c-coral:#ff8181;
    --c-yellow:#fee355;
    --c-mint:#81ff9c;
    --c-aqua:#20cfc6;
    --maxw:1240px;
    --r-sig:35px;
    --r-tight:4px;
    --sh-sm:0 15px 26px rgba(0,0,0,.03);
    --sh-md:15px 20px 60px rgba(0,0,0,.08);
    --sh-lg:14px 30px 60px rgba(0,0,0,.12);
    --display:'Inter',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  html[lang="ar"]{--display:'Cairo',system-ui,sans-serif;--body:'Cairo',system-ui,sans-serif}
  html[lang="ar"] *{letter-spacing:normal !important}

  *{box-sizing:border-box;margin:0;padding:0}
  html{overflow-x:clip;scroll-behavior:smooth}
  body{
    font-family:var(--body);background:var(--page);color:var(--ink);
    line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip;
  }
  :focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px}
  :focus:not(:focus-visible){outline:none}
  img{max-width:100%;display:block}
  .container{max-width:var(--maxw);margin:0 auto;padding:0 2rem}

  /* ── shared primitives ── */
  .btn{
    display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;border:0;cursor:pointer;
    font-family:var(--body);font-weight:600;font-size:.95rem;border-radius:4px;
    padding:.9rem 1.6rem;background:var(--teal);color:#fff;box-shadow:var(--sh-sm);
    transition:background .25s,transform .25s;
  }
  .btn:hover{background:var(--teal-600);transform:translateY(-2px)}
  .btn svg{width:15px;height:15px}
  [dir="rtl"] .btn svg{transform:scaleX(-1)}
  .btn-ghost{background:transparent;color:var(--ink);box-shadow:none;border:1px solid var(--line)}
  .btn-ghost:hover{background:var(--white);border-color:var(--teal);color:var(--teal)}

  .eyebrow{display:flex;align-items:center;gap:1rem;margin-bottom:1.3rem}
  .eyebrow .tag{
    background:var(--teal-tint);color:var(--teal);font-size:.74rem;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;padding:.5rem 1rem;border-radius:3px;
  }
  html[lang="ar"] .eyebrow .tag{letter-spacing:normal;font-size:.84rem}
  .eyebrow .rule{width:84px;height:1.5px;background:var(--teal);opacity:.45;flex-shrink:0}

  /* anchor jumps must clear the floating bar */
  section[id]{scroll-margin-top:104px;background:var(--band);transition:background .3s}
  /* bands alternate; cards invert so they always separate from their band */
  .band-tint{--band:var(--band-tint);--card-bg:var(--card-on-tint);--chip-bg:#ffffff}
  .band-plain{--band:#ffffff;--card-bg:var(--card-on-plain);--chip-bg:#eef5f6}
  .sec{padding:5rem 0}
  /* section head = the name only, at heading size, with the template's rule */
  .sec-head{margin-bottom:2.6rem;display:flex;align-items:center;gap:1.15rem}
  .sec-name{
    font-family:var(--display);font-size:clamp(1.65rem,2.9vw,2.25rem);font-weight:700;
    letter-spacing:-.03em;line-height:1.15;color:var(--ink);white-space:nowrap;
  }
  html[lang="ar"] .sec-name{letter-spacing:normal;line-height:1.4;font-weight:700}
  .sec-head .rule{
    height:2px;flex:1;max-width:190px;border-radius:2px;opacity:.55;
    background:linear-gradient(90deg,var(--teal),rgba(0,128,128,0));
  }
  [dir="rtl"] .sec-head .rule{background:linear-gradient(270deg,var(--teal),rgba(0,128,128,0))}
  html[lang="ar"] h1{line-height:1.4;letter-spacing:normal}
  h1 .accent{color:var(--teal);font-style:normal}
  .hl{color:var(--teal);font-weight:600}

  .card{
    background:var(--card-bg);border:1px solid var(--line);
    border-radius:var(--r-sig) var(--r-tight) var(--r-sig) var(--r-tight);
    box-shadow:var(--sh-sm);transition:transform .3s,box-shadow .3s,border-color .3s;
  }
  [dir="rtl"] .card,[dir="rtl"] .soon,[dir="rtl"] .dropdown{
    border-radius:var(--r-tight) var(--r-sig) var(--r-tight) var(--r-sig);
  }
  .card:hover{transform:translateY(-5px);box-shadow:var(--sh-md);border-color:#cfe4e4}

  .reveal{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.8,.2,1) var(--rd,0ms),transform .7s cubic-bezier(.2,.8,.2,1) var(--rd,0ms)}
  .reveal.in{opacity:1;transform:none}

  /* ── nav ── */
  /* floating island: the bar detaches from the top edge and rides above content */
  .topbar{position:sticky;top:0;z-index:80;background:transparent;padding:.85rem 0;pointer-events:none}
  .topbar .container{pointer-events:none}
  .nav{
    pointer-events:auto;
    display:flex;align-items:center;justify-content:space-between;gap:1.4rem;
    padding:.5rem .5rem .5rem 1.15rem;
    border-radius:999px;
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(16px) saturate(165%);
    -webkit-backdrop-filter:blur(16px) saturate(165%);
    border:1px solid rgba(203,221,221,.6);
    box-shadow:0 6px 26px rgba(10,60,60,.06), 0 1px 3px rgba(10,60,60,.04);
    transition:box-shadow .34s ease, background .34s ease, border-radius .3s ease;
  }
  .topbar.stuck .nav{
    background:rgba(255,255,255,.86);
    box-shadow:0 12px 36px rgba(10,60,60,.11), 0 2px 6px rgba(10,60,60,.05);
  }
  /* wordmark: two-tone MS monogram + name in Plus Jakarta Sans, tight tracking */
  .brand{
    display:flex;align-items:center;gap:.6rem;text-decoration:none;flex-shrink:0;
    font-family:'Plus Jakarta Sans',var(--display);font-weight:800;font-size:1.16rem;
    letter-spacing:-.035em;line-height:1;color:var(--teal);white-space:nowrap;
    transition:color .22s;
  }
  html[lang="ar"] .brand{font-family:'Cairo',sans-serif;letter-spacing:normal;font-weight:700}
  .brand .mark{width:27px;height:34px;flex-shrink:0;display:grid;place-items:center}
  .brand .mark svg{width:100%;height:100%;display:block;overflow:visible}
  .brand .ms-letters{fill:var(--teal);transition:fill .22s}
  .brand .ms-rule{fill:var(--accent);transition:fill .22s}
  .brand:hover{color:var(--teal-600)}
  .brand:hover .ms-letters{fill:var(--teal-600)}
  .brand:hover .ms-rule{fill:var(--accent-deep)}
  /* dotless i + a coloured dot, matching the monogram rule */
  .brand .idot{position:relative}
  .brand .idot i{
    position:absolute;left:50%;top:.055em;transform:translateX(-50%);
    width:.16em;height:.16em;border-radius:50%;background:var(--accent);
    transition:background .22s;
  }
  .brand:hover .idot i{background:var(--accent-deep)}
  .nav-links{display:flex;align-items:center;gap:1.7rem;list-style:none}
  .nav-links > li > a,.more-btn{
    font-family:var(--body);font-size:.9rem;font-weight:500;color:var(--ink-2);
    text-decoration:none;background:none;border:0;cursor:pointer;
    padding:.42rem .85rem;border-radius:999px;
    transition:color .22s, background .22s;
    display:inline-flex;align-items:center;gap:.28rem;white-space:nowrap;
  }
  .nav-links > li > a:hover,.more-btn:hover,.more.open .more-btn{color:var(--teal);background:rgba(0,128,128,.06)}
  /* soft capsule instead of an underline */
  .nav-links > li > a.active{background:var(--teal-tint);color:#0f6f6e;font-weight:600}
  .more{position:relative}
  .more-btn svg{width:13px;height:13px;stroke-width:1.7;opacity:.75;transition:transform .25s,opacity .22s}
  .more-btn:hover svg,.more.open .more-btn svg{opacity:1}
  .more.open .more-btn svg{transform:rotate(180deg)}
  .dropdown{
    position:absolute;inset-inline-start:-1rem;top:calc(100% + .8rem);min-width:190px;
    list-style:none;padding:.5rem;background:rgba(255,255,255,.93);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--line);border-radius:18px 4px 18px 4px;
    box-shadow:0 22px 48px rgba(0,60,60,.14);
    opacity:0;visibility:hidden;transform:translateY(9px);
    transition:opacity .22s,transform .22s,visibility .22s;z-index:90;
  }
  .more:hover .dropdown,.more.open .dropdown{opacity:1;visibility:visible;transform:translateY(0)}
  .dropdown::before{content:"";position:absolute;top:-14px;inset-inline:0;height:14px}
  .dropdown a{display:block;padding:.6rem .85rem;border-radius:8px;font-size:.9rem;
    color:var(--ink-2);text-decoration:none;transition:.18s}
  .dropdown a:hover{background:var(--teal-tint);color:var(--teal)}
  /* right-hand actions read as one set: same height, same rhythm */
  .nav-right{display:flex;align-items:center;gap:.5rem;flex-shrink:0}
  .lang{
    width:40px;height:40px;border-radius:999px;border:1px solid rgba(203,221,221,.85);
    background:rgba(255,255,255,.6);color:var(--ink-2);font-family:var(--body);
    font-size:.85rem;font-weight:600;cursor:pointer;flex-shrink:0;
    display:grid;place-items:center;line-height:1;
    transition:color .22s,border-color .22s,background .22s,transform .22s;
  }
  .lang:hover{border-color:var(--teal);color:var(--teal);background:#fff;transform:translateY(-2px)}
  .nav .btn{
    height:40px;padding:0 1.25rem;font-size:.9rem;border-radius:999px;
    box-shadow:0 4px 14px rgba(0,112,111,.22);
  }
  .nav .btn svg{width:14px;height:14px;transition:transform .28s}
  .nav .btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 24px rgba(0,112,111,.30);
  }
  .nav .btn:hover svg{transform:translateX(3px)}
  [dir="rtl"] .nav .btn:hover svg{transform:scaleX(-1) translateX(3px)}
  .burger{display:none;flex-direction:column;gap:4px;background:none;border:0;cursor:pointer;padding:8px}
  .burger span{width:20px;height:2px;background:var(--ink);border-radius:2px;transition:.25s}
  .burger[aria-expanded="true"] span:nth-child(1){transform:translateY(6px) rotate(45deg)}
  .burger[aria-expanded="true"] span:nth-child(2){opacity:0}
  .burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

  /* ── hero ── */
  .hero{padding:3rem 0 5.5rem}
  .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:3.5rem;align-items:center}
  .hero h1{
    font-family:var(--display);font-size:clamp(2.4rem,4.8vw,4rem);line-height:1.14;
    font-weight:600;letter-spacing:-.025em;margin-bottom:1.2rem;
  }
  .hero h1 .accent{position:relative}
  .hero h1 .accent::after{content:"";position:absolute;inset-inline:0;bottom:.08em;height:.3em;
    background:var(--teal);opacity:.13;border-radius:2px;z-index:-1}
  .hero-sub{font-size:1.05rem;line-height:1.75;color:var(--ink-2);max-width:31rem;margin-bottom:2rem}
  .hero-cta{display:flex;gap:.85rem;flex-wrap:wrap;margin-bottom:2.2rem}
  .toolrow{display:flex;align-items:center;gap:1.3rem;flex-wrap:wrap}
  .toolrow .lbl{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);font-weight:600}
  html[lang="ar"] .toolrow .lbl{letter-spacing:normal;font-size:.8rem}
  .tools{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
  .tools span{font-size:.87rem;color:var(--ink-3);font-weight:500}
  .tools i{width:4px;height:4px;border-radius:50%;background:var(--teal);opacity:.4;display:inline-block}

  .stage{position:relative;height:660px;isolation:isolate}
  .halo,.halo2{position:absolute;border-radius:50%;pointer-events:none;z-index:0}
  .halo{width:500px;height:500px;inset-inline-end:-14px;top:44px;
    background:radial-gradient(circle at 35% 30%,#eaf6f6,#f2f9f9 60%,transparent 72%)}
  .halo2{width:360px;height:360px;inset-inline-end:30px;top:150px;border:1.5px dashed #cfe4e4;opacity:.75}
  .blob{
    position:absolute;left:50%;top:0;transform:translateX(-50%) rotate(-5deg);
    width:404px;height:600px;overflow:hidden;z-index:1;
    border-radius:58% 42% 44% 56% / 36% 40% 60% 64%;
    background:linear-gradient(160deg,var(--teal-soft),#eef7f7);box-shadow:var(--sh-lg);
  }
  .blob img{position:absolute;left:50%;top:-16px;transform:translateX(-50%) rotate(5deg);
    width:104%;height:auto}
  .glass{
    position:absolute;left:50%;transform:translateX(-50%);bottom:34px;width:474px;z-index:3;
    padding:1.15rem 1.3rem;background:rgba(255,255,255,.62);
    backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid rgba(255,255,255,.75);
    border-radius:var(--r-sig) var(--r-tight) var(--r-sig) var(--r-tight);
    box-shadow:0 20px 45px rgba(0,60,60,.16);display:flex;align-items:center;gap:1.1rem;
  }
  [dir="rtl"] .glass{border-radius:var(--r-tight) var(--r-sig) var(--r-tight) var(--r-sig)}
  .spark{display:flex;align-items:flex-end;gap:5px;height:38px;flex-shrink:0}
  .spark b{width:9px;border-radius:3px;display:block}
  .glass .t1{font-size:.93rem;font-weight:600;line-height:1.3}
  .glass .t2{font-size:.78rem;color:var(--ink-3);margin-top:.15rem}
  .dot{width:8px;height:8px;border-radius:50%;background:#16a34a;flex-shrink:0;
    box-shadow:0 0 0 0 rgba(22,163,74,.5);animation:pulse 2.4s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 9px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
  .chip{
    position:absolute;inset-inline-end:0;top:150px;z-index:3;
    background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.8);border-radius:14px 4px 14px 4px;
    padding:.7rem .95rem;box-shadow:0 14px 30px rgba(0,60,60,.12);
    display:flex;align-items:center;gap:.6rem;
  }
  .chip svg{width:26px;height:16px}
  .chip .v{font-size:.85rem;font-weight:700;color:var(--teal)}
  .chip .k{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);font-weight:600}
  html[lang="ar"] .chip .k{letter-spacing:normal;font-size:.72rem}
</style>
<style id="css2">
  /* ── about ── */
  .about-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:3.5rem;align-items:start}
  .about-body p{color:var(--ink-2);line-height:1.85;margin-bottom:1.1rem}
  .about-body p strong{color:var(--ink);font-weight:600}
  .about-body p:last-child{
    font-family:'Inter',monospace;font-size:.9rem;color:var(--teal);
    background:var(--teal-tint);border-inline-start:3px solid var(--teal);
    padding:.9rem 1.1rem;border-radius:0 6px 6px 0;margin-top:1.5rem;
  }
  [dir="rtl"] .about-body p:last-child{border-radius:6px 0 0 6px}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  .stat{padding:1.5rem 1.3rem;background:var(--card-bg);border:1px solid var(--line);
    border-radius:18px 4px 18px 4px;transition:transform .3s,box-shadow .3s}
  [dir="rtl"] .stat{border-radius:4px 18px 4px 18px}
  .stat:hover{transform:translateY(-4px);box-shadow:var(--sh-sm)}
  .stat .v{font-family:var(--display);font-size:1.9rem;font-weight:700;color:var(--teal);line-height:1.1}
  .stat .k{font-size:.79rem;color:var(--ink-3);margin-top:.35rem;line-height:1.4}

  /* ── courses · soon ── */
  .soon{
    position:relative;overflow:hidden;
    background:linear-gradient(150deg,var(--teal-tint) 0%,#f2fafa 60%,var(--white) 100%);
    border:1px solid var(--line);
    border-radius:var(--r-sig) var(--r-tight) var(--r-sig) var(--r-tight);
    padding:3rem;box-shadow:var(--sh-md);
    display:grid;grid-template-columns:1.3fr .7fr;gap:2.5rem;align-items:center;
  }
  .soon-pill{display:inline-flex;align-items:center;gap:.5rem;background:#fff;
    border:1px solid var(--line);color:var(--teal);font-size:.74rem;font-weight:700;
    letter-spacing:.13em;text-transform:uppercase;padding:.45rem .9rem;border-radius:99px;margin-bottom:1.1rem}
  html[lang="ar"] .soon-pill{letter-spacing:normal;font-size:.84rem}
  .soon h3{font-family:var(--display);font-size:clamp(1.4rem,2.5vw,1.9rem);font-weight:600;
    letter-spacing:-.02em;line-height:1.3;margin-bottom:.75rem}
  html[lang="ar"] .soon h3{line-height:1.45;letter-spacing:normal}
  .soon p{color:var(--ink-2);line-height:1.7;margin-bottom:1.6rem;max-width:31rem}
  .soon .note{font-size:.81rem;color:var(--ink-3);margin:.9rem 0 0}
  .soon-viz{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:150px}
  .soon-viz b{width:26px;border-radius:6px 6px 3px 3px;display:block;opacity:.9}

  /* ── content · platforms ── */
  .plat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2rem}
  .plat{position:relative;display:flex;flex-direction:column;gap:.6rem;padding:1.7rem 1.4rem;
    text-decoration:none;color:inherit;overflow:hidden}
  .plat::before{content:"";position:absolute;top:-45%;inset-inline-end:-30%;width:190px;height:190px;
    border-radius:50%;background:radial-gradient(closest-side,rgba(var(--pc),.2),transparent 72%);
    opacity:0;transition:opacity .4s;pointer-events:none}
  .plat:hover::before{opacity:1}
  .plat:hover{border-color:rgba(var(--pc),.4)}
  .plat-ico{position:relative;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
    background:rgba(var(--pc),.11);border:1px solid rgba(var(--pc),.2);color:rgb(var(--pc));
    transition:transform .35s,background .35s}
  .plat:hover .plat-ico{transform:scale(1.08);background:rgba(var(--pc),.18)}
  .plat-ico svg{width:21px;height:21px}

  /* "MOAMEN" -> "Moamen"; Arabic is caseless so it passes through unchanged */
  function titleCase(s){
    return String(s==null?"":s).toLowerCase()
      .replace(/(^|[\s\-'])([\S])/g, function(_,a,b){ return a + b.toUpperCase(); });
  }
  /* renders the name with a dotless i so the dot can carry the accent colour */

  function deepMerge(base, over){
    if(Array.isArray(base)&&Array.isArray(over)){
      return base.map(function(b,i){ return over[i]!==undefined?deepMerge(b,over[i]):b; });
    }
    if(base&&over&&typeof base==="object"&&typeof over==="object"&&!Array.isArray(base)){
      var out={},k;
      for(k in base) out[k]=base[k];
      for(k in over) out[k]=(k in base)?deepMerge(base[k],over[k]):over[k];
      return out;
    }
    return over!==undefined?over:base;
  }

      }).join("")+'</div>'+
      (s.cta?'<div class="svc-cta reveal"><h3>'+esc(s.cta.heading||"")+'</h3>'+
        '<a class="btn" href="#contact">'+esc(s.cta.button||"")+ICONS.arrow+'</a></div>':"")+
      '</div>';
  }

  /* ── experience ── */
  function renderExperience(d){
    var e=d.experience||{}, ed=e.education||{};
    document.getElementById("experience").innerHTML='<div class="container">'+head(e)+
      '<div class="tl">'+(e.items||[]).map(function(it,i){
        return '<div class="tl-item reveal'+(it.current?' now':'')+'" style="--rd:'+(i*80)+'ms">'+
          '<div class="card tl-card">'+
            '<div class="tl-top"><h3>'+esc(it.title)+'</h3>'+
              (it.current?'<span class="now-tag">'+esc(t("now"))+'</span>':"")+'</div>'+
            '<div class="tl-co">'+esc(it.company)+'</div>'+
            '<div class="tl-meta">'+esc(it.period)+(it.location?' · '+esc(it.location):"")+'</div>'+
            '<ul>'+(it.bullets||[]).map(function(b){return '<li>'+inline(b)+'</li>';}).join("")+'</ul>'+
          '</div></div>';
      }).join("")+'</div>'+
      (ed.school?'<div class="card edu reveal">'+
        '<span class="edu-ico">'+ICONS.cap+'</span>'+
        '<div><h3>'+esc(ed.degreeShort||"")+' · '+esc(ed.school)+'</h3>'+
        '<div class="f">'+esc(ed.field||"")+'</div></div>'+
        (ed.year?'<span class="y">'+esc(ed.year)+'</span>':"")+'</div>':"")+
      '</div>';
  }

  /* ── skills ── */
  function renderSkills(d){
    var s=d.skills||{};
    document.getElementById("skills").innerHTML='<div class="container">'+head(s)+
      '<div class="cat-grid">'+(s.categories||[]).map(function(c,i){
        return '<div class="card cat reveal" style="--rd:'+(i*70)+'ms"><h3>'+esc(c.name)+'</h3>'+
          '<div class="chips">'+(c.items||[]).map(function(it){
            var ic=it.iconType==="url"&&it.iconValue?'<img src="'+esc(it.iconValue)+'" alt="" loading="lazy">':"";
            return '<span>'+ic+esc(it.name)+'</span>';
          }).join("")+'</div></div>';
      }).join("")+'</div>'+
      ((s.certifications||[]).length?'<h3 class="reveal" style="font-family:var(--display);font-size:1.05rem;font-weight:600;margin:2.4rem 0 0">'+
        esc(t("certifications"))+'</h3><div class="certs">'+s.certifications.map(function(c,i){
          return '<div class="cert reveal" style="--rd:'+(i*60)+'ms"><div class="t">'+esc(c.type)+'</div>'+
            '<div class="n">'+esc(c.title)+'</div></div>';
        }).join("")+'</div>':"")+
      '</div>';
  }

  /* ── projects ── */
  var PF=[{k:"powerbi",l:"Power BI",m:["power bi"]},{k:"excel",l:"Excel",m:["excel"]},
          {k:"sql",l:"SQL",m:["sql"]},{k:"python",l:"Python",m:["python"]}];
  function ptags(p){
    var hay=((p.tech||"")+" "+(p.techPills||[]).join(" ")).toLowerCase();
    return PF.filter(function(f){return f.m.some(function(m){return hay.indexOf(m)>=0;});})
             .map(function(f){return f.k;});
  }
  function renderProjects(d){
    var pj=d.projects||{}, items=pj.items||[], counts={};
    items.forEach(function(p){ ptags(p).forEach(function(k){counts[k]=(counts[k]||0)+1;}); });
    var chips='<button class="pchip on" data-f="all">'+esc(t("filterAll"))+
      '<span class="n">'+items.length+'</span></button>'+
      PF.filter(function(f){return counts[f.k];}).map(function(f){
        return '<button class="pchip" data-f="'+f.k+'">'+esc(f.l)+'<span class="n">'+counts[f.k]+'</span></button>';
      }).join("");
    document.getElementById("projects").innerHTML='<div class="container">'+head(pj)+
      '<div class="pfilters" id="pfilters">'+chips+'</div>'+
      '<div class="proj-grid" id="projGrid">'+items.map(function(p,i){
        var m=(p.media||[])[0];
        return '<a class="card proj reveal" href="#/project/'+esc(p.id)+'" data-tags="'+esc(ptags(p).join(" "))+'" style="--rd:'+(i*70)+'ms">'+
          '<div class="proj-media'+(m?'':' empty')+'">'+(m?'<img src="'+esc(m)+'" alt="'+esc(p.title)+'" loading="lazy">':'')+'</div>'+
          '<div class="proj-body">'+
            '<div class="proj-top"><span>// '+esc(p.number)+'</span><span class="tech">'+esc(p.tech)+'</span></div>'+
            '<h3>'+esc(p.title)+'</h3>'+
            '<p>'+String(p.descriptionHtml||"").replace(/<[^>]+>/g,"")+'</p>'+
            '<span class="proj-more">'+esc(t("viewDetails"))+ICONS.arrow+'</span>'+
          '</div></a>';
      }).join("")+'</div></div>';
  }

  /* ── community ── */
  function renderCommunity(d){
    var v=d.volunteering||{};
    document.getElementById("community").innerHTML='<div class="container">'+head(v)+
      '<div class="vol-grid">'+(v.items||[]).map(function(it,i){
        return '<div class="card vol reveal" style="--rd:'+(i*80)+'ms">'+
          '<div class="vol-top"><span class="vol-ico">'+ICONS.users+'</span>'+
            '<div><h3>'+esc(it.title)+'</h3><div class="org">'+esc(it.organization)+'</div></div></div>'+
          '<div class="meta">'+esc(it.period)+(it.category?' · '+esc(it.category):"")+'</div>'+
          '<ul>'+(it.bullets||[]).map(function(b){return '<li>'+inline(b)+'</li>';}).join("")+'</ul></div>';
      }).join("")+'</div></div>';
  }

  /* ── contact ── */
  function renderContact(d){
    var c=d.contact||{}, p=d.profile||{}, s=p.social||{};
    var links=[["github","github"],["linkedin","linkedin"],["youtube","youtube"],
               ["tiktok","tiktok"],["instagram","instagram"],["facebook","facebook"]];
    document.getElementById("contact").innerHTML='<div class="container">'+
      '<div class="contact-wrap reveal">'+
        '<h2 class="sec-name">'+esc(c.eyebrow||"")+'</h2>'+
        '<div class="contact-actions">'+
          (p.email?'<a class="btn" href="mailto:'+esc(p.email)+'">'+ICONS.mail+esc(t("emailMe"))+'</a>':"")+
          (p.resumeUrl?'<a class="btn btn-ghost" href="'+esc(p.resumeUrl)+'" target="_blank" rel="noopener">'+
            ICONS.doc+esc(t("resume"))+'</a>':"")+
        '</div>'+
        '<div class="socials">'+links.filter(function(l){return s[l[0]];}).map(function(l){
          return '<a href="'+esc(s[l[0]])+'" target="_blank" rel="noopener" aria-label="'+l[0]+'">'+ICONS[l[1]]+'</a>';
        }).join("")+'</div>'+
      '</div></div>';
  }

  /* ── footer ── */
  function renderFooter(d){
    var p=d.profile||{}, f=d.footer||{};
    document.getElementById("footer").innerHTML='<div class="container"><div class="foot">'+
      '<a class="brand" href="#home" aria-label="'+esc(titleCase(p.firstName)+" "+titleCase(p.lastName))+'">'+
        '<span class="mark">'+ICONS.logo+'</span>'+
        '<span aria-hidden="true">'+brandName(p.firstName)+' '+brandName(p.lastName)+'</span></a>'+
      '<p>© '+new Date().getFullYear()+' '+esc((p.firstName||"")+" "+(p.lastName||""))+' · '+esc(t("rights"))+'</p>'+
      '</div></div>';
  }

  function renderAll(){
    var d=D();
    renderNav(d); renderHero(d); renderAbout(d); renderCourses(d); renderContent(d);
    renderFreelance(d); renderExperience(d); renderSkills(d); renderProjects(d);
    renderCommunity(d); renderContact(d); renderFooter(d);
    bind();
    reveal();
  }
  window.__renderAll = renderAll;
  window.__D = D;
  window.__t = t;
  window.__esc = esc;
  window.__inline = inline;
  window.__ICONS = ICONS;
  window.__setLang = function(l){ LANG=l; };
  window.__getLang = function(){ return LANG; };
  window.__setData = function(x){ DATA_EN=x; };
  window.__SECTIONS = SECTIONS;

  /* ── project detail page ── */
  function projectById(id){
    var items=(D().projects||{}).items||[];
    for(var i=0;i<items.length;i++) if(items[i].id===id) return items[i];
    return null;
  }
  function renderProjectPage(p){
    var zip=p.githubUrl?p.githubUrl.replace(/\/$/,"")+"/archive/refs/heads/main.zip":"";
    var media=(p.media||[]);
    var html='<div class="container proj-page">'+
      '<a class="pp-back" href="#projects">'+ICONS.back+esc(t("backToProjects"))+'</a>'+
      '<div class="pp-head">'+
        '<div class="proj-top"><span>// '+esc(p.number)+'</span><span class="tech">'+esc(p.tech)+'</span></div>'+
        '<h1>'+esc(p.title)+'</h1>'+
        '<div class="pp-desc">'+inline(p.descriptionHtml||"")+'</div>'+
        '<div class="pp-actions">'+
          (p.githubUrl?'<a class="btn" href="'+esc(p.githubUrl)+'" target="_blank" rel="noopener">'+
            ICONS.github+esc(t("viewGithub"))+'</a>':"")+
          (zip?'<a class="btn btn-ghost" href="'+esc(zip)+'">'+ICONS.doc+'ZIP</a>':"")+
        '</div>'+
      '</div>'+
      ((p.stats||[]).length?'<div class="pp-stats">'+p.stats.map(function(s){
        return '<div class="stat"><div class="v">'+esc(s.value)+'</div><div class="k">'+esc(s.label)+'</div></div>';
      }).join("")+'</div>':"")+
      (media.length?'<div class="pp-media">'+media.map(function(m){
        return '<img src="'+esc(m)+'" alt="'+esc(p.title)+'" loading="lazy">';
      }).join("")+'</div>':"")+
      ((p.tools||[]).length?'<h2 class="pp-h2">'+(LANG==="ar"?"الأدوات":"Tools")+'</h2>'+
        '<div class="pp-tools">'+p.tools.map(function(tl){
          return '<div class="card pp-tool">'+
            (tl.iconUrl?'<img src="'+esc(tl.iconUrl)+'" alt="" loading="lazy">':"")+
            '<div><h3>'+esc(tl.name)+'</h3><p>'+esc(tl.usage||"")+'</p></div></div>';
        }).join("")+'</div>':"")+
      ((p.process||[]).length?'<h2 class="pp-h2">'+(LANG==="ar"?"طريقة العمل":"Process")+'</h2>'+
        '<div class="pp-proc">'+p.process.map(function(s,i){
          return '<div class="card pp-step"><span class="num">'+(i+1)+'</span>'+
            '<h3>'+esc(s.step)+'</h3><p>'+esc(s.description)+'</p></div>';
        }).join("")+'</div>':"")+
      (p.reportInsights?renderInsights(p.reportInsights):"")+
      '</div>';
    return html;
  }
  function renderInsights(r){
    var pcol={HIGH:"var(--c-coral)",MEDIUM:"var(--c-yellow)",LOW:"var(--teal)"};
    return '<h2 class="pp-h2">'+(LANG==="ar"?"النتائج":"Findings")+'</h2>'+
      (r.metaLine?'<p class="pp-meta">'+esc(r.metaLine)+'</p>':"")+
      ((r.kpis||[]).length?'<div class="pp-kpis">'+r.kpis.map(function(k){
        return '<div class="stat"><div class="v">'+esc(k.value)+'</div><div class="k">'+esc(k.label)+
          (k.sub?'<br><span style="color:var(--ink-4);font-size:.74rem">'+esc(k.sub)+'</span>':"")+'</div></div>';
      }).join("")+'</div>':"")+
      ((r.insights||[]).length?'<div class="pp-ins">'+r.insights.map(function(x){
        return '<div class="card pp-in"><div class="n">'+esc(x.num)+'</div>'+
          '<h3>'+esc(x.title)+'</h3><p>'+esc(x.text)+'</p></div>';
      }).join("")+'</div>':"")+
      ((r.recommendations||[]).length?'<div class="pp-recs">'+r.recommendations.map(function(c){
        return '<div class="card pp-rec"><span class="pri" style="color:'+(pcol[c.priority]||"var(--teal)")+
          ';border-color:'+(pcol[c.priority]||"var(--teal)")+'">'+esc(c.priority)+'</span>'+
          '<h3>'+esc(c.title)+'</h3><p>'+esc(c.text)+'</p>'+
          (c.impact?'<p class="imp">'+esc(c.impact)+'</p>':"")+'</div>';
      }).join("")+'</div>':"")+
      ((r.bottomLine||[]).length?'<div class="pp-bottom">'+r.bottomLine.map(function(b,i){
        return '<p><span>'+(i+1)+'</span>'+esc(b)+'</p>';
      }).join("")+'</div>':"");
  }

  function router(){
    var m=(location.hash||"").match(/^#\/project\/([\w-]+)/);
    var main=document.getElementById("mainView"), pp=document.getElementById("projectPage");
    if(m){
      var p=projectById(m[1]);
      if(p){
        main.style.display="none";
        pp.innerHTML=renderProjectPage(p);
        pp.style.display="block";
        window.scrollTo(0,0);
        reveal();
        return;
      }
    }
    pp.style.display="none"; pp.innerHTML="";
    main.style.display="";
  }

  /* ── interactions ── */
  function bind(){
    var nav=document.getElementById("nav"),
        more=document.getElementById("more"),
        mBtn=document.getElementById("moreBtn"),
        burger=document.getElementById("burger"),
        langBtn=document.getElementById("langBtn");

    if(mBtn) mBtn.addEventListener("click",function(e){
      e.stopPropagation();
      var o=more.classList.toggle("open");
      mBtn.setAttribute("aria-expanded",o?"true":"false");
    });
    if(burger) burger.addEventListener("click",function(){
      var o=nav.classList.toggle("open");
      burger.setAttribute("aria-expanded",o?"true":"false");
    });
    nav.addEventListener("click",function(e){
      if(e.target.closest("a[data-sec]")){
        nav.classList.remove("open");
        if(burger) burger.setAttribute("aria-expanded","false");
        if(more){ more.classList.remove("open"); if(mBtn) mBtn.setAttribute("aria-expanded","false"); }
      }
    });
    if(langBtn) langBtn.addEventListener("click",function(){
      var nl=LANG==="ar"?"en":"ar";
      LANG=nl;
      try{ localStorage.setItem("mz-lang",nl); }catch(err){}
      document.documentElement.lang=nl;
      document.documentElement.dir=nl==="ar"?"rtl":"ltr";
      var y=window.scrollY;
      renderAll();
      router();
      window.scrollTo(0,y);
    });

    var pf=document.getElementById("pfilters");
    if(pf) pf.addEventListener("click",function(e){
      var b=e.target.closest(".pchip"); if(!b) return;
      var f=b.getAttribute("data-f");
      pf.querySelectorAll(".pchip").forEach(function(x){x.classList.toggle("on",x===b);});
      document.querySelectorAll("#projGrid .proj").forEach(function(c){
        c.hidden = f!=="all" && (" "+(c.getAttribute("data-tags")||"")+" ").indexOf(" "+f+" ")<0;
      });
    });
  }

  document.addEventListener("click",function(e){
    var more=document.getElementById("more"), mBtn=document.getElementById("moreBtn");
    if(more&&!more.contains(e.target)){
      more.classList.remove("open");
      if(mBtn) mBtn.setAttribute("aria-expanded","false");
    }
  });
  document.addEventListener("keydown",function(e){
    if(e.key!=="Escape") return;
    var more=document.getElementById("more"), mBtn=document.getElementById("moreBtn"),
        nav=document.getElementById("nav"), burger=document.getElementById("burger");
    if(more){more.classList.remove("open"); if(mBtn) mBtn.setAttribute("aria-expanded","false");}
    if(nav){nav.classList.remove("open"); if(burger) burger.setAttribute("aria-expanded","false");}
  });

  /* ── scroll reveal + spy + sticky ── */
  var io=null;
  function reveal(){
    var els=document.querySelectorAll(".reveal:not(.in)");
    if(!("IntersectionObserver" in window)){
      els.forEach(function(el){el.classList.add("in");}); return;
    }
    if(!io) io=new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); }
      });
    },{rootMargin:"0px 0px -8% 0px",threshold:.06});
    els.forEach(function(el){io.observe(el);});
  }
  function onScroll(){
    var tb=document.getElementById("topbar");
    if(tb) tb.classList.toggle("stuck", window.scrollY>10);
    var y=window.scrollY+130, cur=null;
    SECTIONS.forEach(function(id){
      var s=document.getElementById(id);
      if(s&&s.offsetParent!==null&&s.offsetTop<=y) cur=id;
    });
    document.querySelectorAll("#nav a[data-sec]").forEach(function(a){
      a.classList.toggle("active", a.getAttribute("data-sec")===cur);
    });
  }
  window.addEventListener("scroll",onScroll,{passive:true});
  window.addEventListener("hashchange",router);

  /* ── boot ── */
  fetch("data.json")
    .then(function(r){ return r.json(); })
    .then(function(json){
      DATA_EN=json;
      var d=D();
      if(d.siteTitle) document.title=d.siteTitle;
      var md=document.querySelector('meta[name="description"]');
      if(md&&d.siteDescription) md.setAttribute("content",d.siteDescription);
      renderAll();
      router();
      onScroll();
    })
    .catch(function(err){
      document.getElementById("home").innerHTML=
        '<div class="container"><p style="padding:4rem 0;color:#b00">Could not load data.json — '+
        esc(err.message)+'</p></div>';
    });
})();

</script>
</head>
<body>

<div class="topbar" id="topbar">
  <div class="container">
    <nav class="nav" id="nav"></nav>
  </div>
</div>

<main id="mainView">
  <section class="hero band-plain" id="home"></section>
  <section class="sec band-tint" id="about"></section>
  <section class="sec band-plain" id="courses"></section>
  <section class="sec band-tint" id="content"></section>
  <section class="sec band-plain" id="freelance"></section>
  <section class="sec band-tint" id="experience"></section>
  <section class="sec band-plain" id="skills"></section>
  <section class="sec band-tint" id="projects"></section>
  <section class="sec band-plain" id="community"></section>
  <section class="sec band-tint" id="contact"></section>
</main>

<div id="projectPage"></div>
<footer id="footer"></footer>

</body>
</html>
